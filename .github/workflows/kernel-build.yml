name: NetBSD Kernel Cross-Compile CI

on:
  push:
    branches: [ main, vc4-drmkms ]
  pull_request:
    branches: [ main ]

jobs:
  build-earmv7hf:
    name: earmv7hf / GENERIC
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libssl-dev git u-boot-tools
      - name: Build Tools and Kernel (earmv7hf)
        run: |
          ./build.sh -U -j4 -m evbarm -a earmv7hf -O ./obj -T ./tools tools
          ./build.sh -U -j4 -m evbarm -a earmv7hf -O ./obj -T ./tools kernel=GENERIC
      - name: Upload Kernel Artifact (earmv7hf)
        uses: actions/upload-artifact@v4
        with:
          name: netbsd-kernel-earmv7hf-GENERIC
          path: obj/sys/arch/evbarm/compile/GENERIC/netbsd
          if-no-files-found: error

  build-aarch64:
    name: aarch64 / GENERIC64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libssl-dev git u-boot-tools
      - name: Build Tools and Kernel (aarch64 GENERIC64)
        run: |
          ./build.sh -U -j4 -m evbarm -a aarch64 -O ./obj-aarch64 -T ./tools-aarch64 tools
          ./build.sh -U -j4 -m evbarm -a aarch64 -O ./obj-aarch64 -T ./tools-aarch64 kernel=GENERIC64
      - name: Upload Kernel Artifact (aarch64 GENERIC64)
        uses: actions/upload-artifact@v4
        with:
          name: netbsd-kernel-aarch64-GENERIC64
          path: obj-aarch64/sys/arch/evbarm/compile/GENERIC64/netbsd
          if-no-files-found: error
